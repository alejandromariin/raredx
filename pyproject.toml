[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoofbeat"
version = "0.1.0"
description = "Rare-disease differential diagnosis support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langgraph",       # the flow (pipeline.py)
    "fastapi",         # API (api.py)
    "uvicorn",         # web server for the API
    "pydantic",
    "pyyaml",          # settings.yaml
    "numpy",
    "scikit-learn",    # logistic regression reference (fusion.py)
    "lightgbm",        # learned fusion (fusion.py)
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter"]

[tool.setuptools.packages.find]
include = ["hoofbeat*"]
