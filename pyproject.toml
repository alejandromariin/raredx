[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raredx"
version = "0.1.0"
description = "Rare-disease differential diagnosis support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "openai",
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "pyyaml",
    "python-dotenv",
    "pandas",
    "numpy",
    "scikit-learn",
    "lightgbm",
    "hpo3",
    "tavily-python",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers"]
dev = ["pytest", "ruff", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]
