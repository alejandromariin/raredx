# Project settings: paths, budget, models. Filled in as we go.
paths:
  raw: data/raw
  processed: data/processed
  results: results
data_versions:          # pinned in hoofbeat/data.py
  phenopacket_store: 0.1.27
  hpo: v2026-09-01
budget_usd: 50          # max total API spend for the hackathon
llm:
  gateway_url: ${BIFROST_URL}
  reasoning_effort: low    # hidden "thinking" tokens are billed: keep it low
  # During development only OpenAI is used (already paid). The other providers are
  # switched on for the final evaluation; models of inactive providers are skipped.
  active_providers: [openai, gemini, groq]
  # Free tiers: max requests per minute per provider (the client waits between calls)
  requests_per_minute: {gemini: 10, groq: 6}
  # Differential-diagnosis ensemble. Budget decision (8.83 $ left on OpenAI, no new deposits):
  # one paid model + one free tier from another family. GPT-6.1 Sol and Claude Sonnet were dropped.
  # cutoff = training data cutoff, used for the contamination guard (null = not confirmed yet)
  ensemble:
    - {provider: openai, model: gpt-6-luna,            cutoff: 2026-05-18}
    - {provider: gemini, model: gemini-3.5-flash-lite, cutoff: null}       # Google AI Studio free tier
  # Contamination check only (not in the ensemble): open model with an old cutoff, Groq free tier
  contamination_model: {provider: groq, model: openai/gpt-oss-120b, cutoff: 2024-07-31}
  # Cheap model for symptom extraction and explanations
  utility: {provider: openai, model: gpt-6-luna, cutoff: 2026-05-18}
  # Embeddings to find the HPO term of each extracted symptom (BioLORD comparison dropped
  # for time; 512 dimensions keep the HPO index small)
  embedding: {provider: openai, model: text-embedding-3-small, dimensions: 512}
  # USD per 1M tokens [input, output], used to track spend against budget_usd
  prices:
    gpt-6.1-sol: [2.00, 10.00]
    gpt-6-luna: [0.10, 0.50]
    gemini-3.8-flash: [0.75, 3.75]
    claude-sonnet-5-5: [2.00, 10.00]
    openai/gpt-oss-120b: [0.00, 0.00]        # Groq free tier
    gemini-3.5-flash-lite: [0.00, 0.00]      # Google AI Studio free tier
    gemini-3.1-flash-lite: [0.00, 0.00]
    gemini-2.5-flash-lite: [0.00, 0.00]
    text-embedding-3-small: [0.02, 0.00]
eval:
  seed: 42
  # Cases are split by paper, so no paper has cases in two splits (share of cases)
  split_fractions: {train: 0.7, val: 0.1, test: 0.2}
  # Cases actually sent to the LLMs (every case costs 4 LLM calls)
  sample_size: {train: 1000, val: 200, test: 500}
  # Cap per paper inside each sample, so a few big cohort papers don't dominate
  max_cases_per_paper: 5
fusion:
  # LLMs whose answers feed the fusion. During development only the cheap one;
  # for the final evaluation, the four ensemble models.
  models: [openai/gpt-6-luna, gemini/gemini-3.5-flash-lite]
  ranker_top: 50               # candidates taken from the ranker per patient
  learning_curve: [250, 500, 1000]
phenotype:
  # Below this similarity the symptom is left unmatched for the doctor to review
  min_score: 0.45
  # HPO alternatives shown to the doctor for each symptom
  alternatives: 5
evidence:
  # Live web evidence with Tavily, shown to the doctor (never used for the ranking)
  top: 3          # candidates searched
  max_results: 3  # default results per search (literature 3, trials 2, support 2: see evidence.py)
